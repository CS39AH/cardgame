<!--
    SCREEN: Credits
    A teacher's attendance sheet on a clipboard. The roster and
    sections are filled in by setupCredits() in js/main.js from
    the data in js/content/credits.js.
-->

<section class="credits-screen">

    <a href="#" class="cards-screen__back">← Back to Title</a>

    <div class="clipboard">
        <article class="attendance">

            <h1 class="attendance__heading">Attendance: Substitute Chaos</h1>

            <p class="attendance__meta">
                <span><strong>Class:</strong> CS 39AH</span>
                <span><strong>School:</strong> MSU Denver</span>
                <span><strong>Term:</strong> Fall 2026</span>
            </p>

            <table class="attendance__table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Worked On</th>
                        <th>Present</th>
                    </tr>
                </thead>
                <tbody class="attendance__roster"></tbody>
            </table>

            <div class="attendance__sections"></div>

            <p class="attendance__signature">Signed:<span>The Substitute</span></p>

        </article>
    </div>

</section>
