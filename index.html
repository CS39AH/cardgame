<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substitute Chaos</title>
    <meta name="description" content="A school-themed deck-building card game. Survive the school day as a substitute teacher.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Kalam:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!--
        =============================================================
        SUBSTITUTE CHAOS — SPA SHELL
        =============================================================
        Single HTML file. The <main id="screen"> container holds the
        current screen. The title screen lives here by default; other
        screens are loaded from screens/<name>.html by js/main.js
        based on the URL hash (#cards, #combat, etc.).

        TEAMMATES: Don't edit index.html without team agreement.
        Screen content goes in screens/<yourscreen>.html.
        =============================================================
    -->

    <!-- Settings (js/ui/settings.js). Outside #screen so the gear button is on
         every screen, the battle included. The sliders are wired up in js/audio.js. -->
    <button id="settings-open" class="settings-toggle" type="button"
            aria-label="Settings" aria-haspopup="dialog">⚙️</button>

    <div id="settings" class="settings" hidden>
        <div class="settings__panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <button id="settings-close" class="settings__close" type="button" aria-label="Close settings">✕</button>
            <h2 id="settings-title" class="settings__title">Settings</h2>

            <section class="settings__section">
                <h3 class="settings__heading">Sound</h3>

                <div class="settings__row">
                    <label class="settings__label" for="music-volume">🎵 Music</label>
                    <input id="music-volume" class="settings__slider" type="range"
                           min="0" max="100" step="1" value="15">
                    <span id="music-volume-value" class="settings__value">15%</span>
                </div>

                <div class="settings__row">
                    <label class="settings__label" for="sfx-volume">🔔 Sounds</label>
                    <input id="sfx-volume" class="settings__slider" type="range"
                           min="0" max="100" step="1" value="100">
                    <span id="sfx-volume-value" class="settings__value">100%</span>
                </div>
            </section>

            <section class="settings__section">
                <h3 class="settings__heading">Motion</h3>

                <label class="settings__check">
                    <input id="reduce-animations" type="checkbox">
                    <span>
                        <strong>Reduce animations</strong>
                        <small>Fewer zooms, slams, and flying cards. Turn this on if motion on screen bothers you.</small>
                    </span>
                </label>
            </section>

            <button id="settings-done" class="btn btn--primary settings__done" type="button">Done</button>
        </div>
    </div>

    <main id="screen">

        <!-- Default screen: title (entry point) -->
        <section class="title-screen">

            <div class="title-screen__header">
                <p class="title-screen__welcome">A Deck-Building Card Game</p>
                <h1 class="title-screen__brand">Substitute Chaos</h1>
                <p class="title-screen__subtitle">Survive the school day. Restore order. Escape before the bell.</p>
            </div>

            <!-- "Choose your teacher" heading over the staff card -->
            <p class="teacher-pick__heading">Choose Your Teacher</p>

            <div class="card-stage">
                <!-- Orbiting school supplies (filled in by js/ui/orbit.js) -->
                <div id="orbit" class="orbit" aria-hidden="true"></div>

                <!-- Previous staff -->
                <button id="teacher-prev"
                        class="teacher-selector__arrow teacher-selector__arrow--prev"
                        type="button"
                        aria-label="Previous staff member">
                    ‹
                </button>

                <!-- Staff card -->
                <div id="demo-card" class="card-slot"></div>

                <!-- Next staff -->
                <button id="teacher-next"
                        class="teacher-selector__arrow teacher-selector__arrow--next"
                        type="button"
                        aria-label="Next staff member">
                    ›
                </button>
            </div>

            <!-- Who you picked: name, "2 of 6", and a dot per teacher (js/main.js) -->
            <div class="teacher-pick" aria-live="polite">
                <p class="teacher-pick__name">
                    Playing as <strong id="teacher-name"></strong>
                </p>
                <div class="teacher-pick__dots" id="teacher-dots" role="tablist" aria-label="Teachers"></div>
            </div>

            <div class="title-screen__menu">
                <button id="btn-start" class="btn btn--primary">Start a New Day</button>
                <button id="btn-continue" class="btn" hidden>Continue Your Day</button>
                <button id="btn-how" class="btn btn--secondary">How to Play</button>
                <a href="#cards" class="btn btn--secondary">Cards</a>
                <button id="btn-credits" class="btn btn--secondary">Credits</button>
            </div>

            <div class="title-screen__footer">
                <p>MSU Denver · CS 39AH · Fall 2026</p>
            </div>

        </section>

    </main>

    <!-- Animations are always on, whatever the computer's own "reduce motion"
         setting is. The only way to turn them down is the game's Settings
         checkbox, which is remembered here (js/ui/settings.js). -->
    <script>
        window.SC = window.SC || {};
        try {
            SC.REDUCE_ANIMATIONS = localStorage.getItem('sc-reduce-animations') === '1';
        } catch (e) {
            SC.REDUCE_ANIMATIONS = false;
        }
        document.documentElement.classList.toggle('reduce-animations', SC.REDUCE_ANIMATIONS);
    </script>
    <script src="js/content/cards.js"></script>
    <script src="js/content/credits.js"></script>
    <script src="js/content/days.js"></script>
    <script src="js/ui/card.js"></script>
    <script src="js/ui/tutorial.js"></script>   <!-- NEW: renders cards on the tutorial screen -->
    <script src="js/ui/orbit.js"></script>
    <script src="js/ui/map.js"></script>
    <script src="js/ui/zones.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ui/settings.js"></script>
    <script src="js/content/starter-cards.js"></script>
    <script src="js/content/enemies.js"></script>
    <script src="js/content/levels.js"></script>
    <script src="js/engine/combat.js"></script>
    <script src="js/ui/battle-fx.js"></script>
    <script src="js/ui/battle.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
